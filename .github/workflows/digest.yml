name: AI Digest

on:
  schedule:
    # 03:17 UTC = 08:17 Pakistan time. Scheduled early because GitHub starts
    # scheduled runs 4-6h late; aim is to land around 13:00 PKT. Off-the-hour
    # minute avoids the :00 rush.
    - cron: "17 3 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write           # needed so the job can commit seen.json back

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optional. Unset = X is skipped, everything else still runs.
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # Luna = cheap summarisation tier. Swap to gpt-5.6-terra if the
          # ranking feels shallow. Never use bare "gpt-5.6" — it routes to Sol.
          OPENAI_MODEL: gpt-5.6-luna
        run: python digest.py

      - name: Save seen items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "digest run $(date -u +%Y-%m-%d)"
          git push